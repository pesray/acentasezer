<style>
:root{--bg:#0b0b0c;--bg2:#121214;--card:#1a1a1a;--card2:#2a2a2a;--accent:#FFD700;--cta1:#c9a227;--cta2:#e8c547;--text:#ffffff;--muted:#b9b9b9;--line:rgba(255,255,255,.09);--red:#ff4d4d;--redbg:rgba(220,30,30,.18);--ff-d:'Zilla Slab',serif;--ff:'Hanken Grotesk',sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--ff);margin:0;transition:background .3s,color .3s}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--cta2)}
.promo{background:#c4161c;border-bottom:2px solid #FFD700;color:#fff;font-size:.85rem;font-weight:600;position:relative;overflow:hidden;height:38px;display:flex;align-items:center}
.promo-track{display:flex;gap:3rem;white-space:nowrap;animation:mq 32s linear infinite;padding-left:100%}
.promo-track span{display:flex;align-items:center;gap:.5rem}.promo-track b{color:#FFD700}
@keyframes mq{to{transform:translateX(-100%)}}
.promo-x{position:absolute;right:0;top:0;bottom:0;width:38px;background:#c4161c;border:0;color:#fff;font-size:1.3rem}
.hdr{position:sticky;top:0;z-index:1030;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1}.brand b{font-family:var(--ff-d);font-size:1.45rem;color:var(--accent);letter-spacing:.04em}.brand small{font-size:.62rem;letter-spacing:.32em;color:var(--muted);margin-top:4px}
.logo{display:inline-flex}.logo img{height:52px;width:auto;display:block}
.hdr .nav-link{color:var(--text);font-weight:500;font-size:.92rem;padding:.5rem .8rem!important}.hdr .nav-link:hover{color:var(--accent)}
.navbar-toggler{border-color:var(--line);color:var(--text)}
.lang{display:flex;gap:4px}.lang button{background:none;border:1px solid var(--line);color:var(--muted);font-size:.72rem;font-weight:700;padding:5px 9px;border-radius:8px}.lang button.on{background:var(--accent);color:#111;border-color:var(--accent)}
.btn-cta{background:linear-gradient(135deg,var(--cta1),var(--cta2));border:1px solid rgba(0,0,0,.14);color:#0b0b0c!important;font-weight:800;border-radius:12px;padding:10px 16px;transition:transform .15s,filter .15s}
.btn-cta:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn-ghost{border:1px solid var(--accent);color:var(--accent);background:transparent;font-weight:700;border-radius:12px;padding:9px 15px}
.hero{position:relative;min-height:560px;display:flex;align-items:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1800&q=80') center/cover;animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.08)}}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.55) 60%,var(--bg))}
.hero-in{position:relative;z-index:2;width:100%;padding:90px 0 150px}
.hero h1{font-family:var(--ff-d);font-size:clamp(2.3rem,6vw,4.4rem);font-weight:700;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.5);margin:0 0 .6rem}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:#eee;font-size:clamp(1rem,2vw,1.2rem);max-width:620px;margin:0}
.qf{position:relative;z-index:3;margin-top:-110px;background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid color-mix(in oklab,var(--accent) 35%,transparent);border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.qf label{font-size:.72rem;font-weight:700;letter-spacing:.14em;color:var(--accent);margin-bottom:6px}
.qf .form-select,.fm .form-control,.fm .form-select{background-color:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:.7rem .9rem}
.qf .form-select:focus,.fm .form-control:focus,.fm .form-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 22%,transparent)}
.qf-note{font-size:.85rem;color:var(--muted);margin-top:14px;display:flex;gap:.5rem;align-items:center}
.trust{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.trust span{display:flex;gap:7px;align-items:center;font-size:.86rem;color:var(--text)}.trust i{color:var(--accent)}
.sec{padding:80px 0}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.24em;color:var(--accent);text-transform:uppercase;margin-bottom:.6rem}
.sec-t{font-family:var(--ff-d);font-size:clamp(1.8rem,4vw,2.7rem);font-weight:700;margin:0 0 .5rem}
.sec-s{color:var(--muted);max-width:640px}
/* ===== transfer kartları (birebir) ===== */
.rc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:30px;margin-top:40px}
@media(max-width:380px){.rc-grid{grid-template-columns:1fr}}
.rc{background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);border-radius:20px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);transition:transform .3s,box-shadow .3s}
.rc:hover{transform:translateY(-8px);box-shadow:0 18px 50px rgba(0,0,0,.6)}
.rc-media{position:relative;display:block;height:280px;overflow:hidden}
.rc-media img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.rc:hover .rc-media img{transform:scale(1.08)}
.rc-badge{position:absolute;top:14px;right:14px;background:linear-gradient(180deg,#ff2a2a,#c80000);color:#fff;font-weight:800;font-size:.9rem;letter-spacing:.12em;padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.35);box-shadow:0 4px 18px rgba(255,0,0,.45)}
.rc-ov{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,rgba(0,0,0,.9) 0%,transparent 100%);padding:30px 24px 20px}
.rc-ov h3{color:#fff;font-size:1.95rem;font-weight:700;margin:0;text-shadow:2px 2px 4px rgba(0,0,0,.5)}
.rc-body{padding:26px 22px 24px;background:var(--card)}
.rc-ozel{font-size:.78rem;font-weight:800;letter-spacing:.16em;color:var(--red);text-transform:uppercase;margin-bottom:12px}
.rc-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rc-box{border-radius:14px;padding:12px;min-width:0;border:1px solid var(--cline);background:color-mix(in oklab,var(--ctext) 3%,transparent)}
.rc-rt{border-color:color-mix(in oklab,var(--accent) 45%,transparent);background:color-mix(in oklab,var(--accent) 6%,transparent);box-shadow:0 0 24px color-mix(in oklab,var(--accent) 12%,transparent),inset 0 0 18px color-mix(in oklab,var(--accent) 6%,transparent)}
.rc-rt-h{font-size:.72rem;font-weight:800;letter-spacing:.1em;color:var(--ctext);text-transform:uppercase;white-space:nowrap}
.rc-ow .rc-rt-h{color:var(--cmuted)}
.rc-rt-p{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;margin:4px 0 8px}
.rc del{color:var(--red);font-weight:700;opacity:.85;text-decoration-thickness:2px;font-size:1rem}
.rc-now{font-size:1.9rem;font-weight:800;color:var(--accent);line-height:1;text-shadow:0 2px 12px color-mix(in oklab,var(--accent) 35%,transparent)}
.rc-ow .rc-now{font-size:1.6rem;text-shadow:none}
.rc-disc{display:inline-flex;align-items:center;gap:5px;background:var(--redbg);border:1px solid color-mix(in oklab,var(--red) 55%,transparent);color:var(--red);font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap}
.rc-disc i{color:#f4b13c;font-size:.72rem}
.rc-book{display:block;width:100%;margin-top:16px;font-size:1.15rem;padding:15px 18px!important;border-radius:14px!important;letter-spacing:.02em}
.rc-stars{display:flex;gap:6px;margin-top:16px;color:#FFD700;font-size:1.3rem}
/* ===== */
.flt{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.flt button{background:var(--bg2);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 15px;font-size:.85rem;font-weight:600}

.guests{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:16px;overflow-x:auto;padding-bottom:10px;margin-top:32px;scroll-snap-type:x mandatory}
.ph{background:repeating-linear-gradient(45deg,var(--card),var(--card) 14px,var(--card2) 14px,var(--card2) 28px);border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:monospace;font-size:.72rem;text-align:center;padding:12px;scroll-snap-align:start}
.guests .ph{aspect-ratio:3/4}
.info{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.info-list{display:grid;gap:14px}
.info-it{display:grid;grid-template-columns:44px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}

.blog-c{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;height:100%}
.blog-c .ph{aspect-ratio:16/9;border:0;border-radius:0}
.blog-c h5{font-size:1.02rem;font-weight:600;padding:16px 18px 0;margin:0;color:var(--text);line-height:1.4}
.blog-c a{display:inline-block;padding:10px 18px 18px;font-weight:600;font-size:.88rem}
.kw{border-top:1px solid var(--line);overflow:hidden;padding:18px 0;color:var(--muted);font-size:.85rem}
.ftr{background:var(--bg2);border-top:1px solid var(--line);padding:60px 0 24px}
.ftr h6{color:var(--accent);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-bottom:14px}
.ftr ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}.ftr li a{color:var(--muted)}.ftr li a:hover{color:var(--accent)}
.ftr p{color:var(--muted);font-size:.92rem}
.copy{border-top:1px solid var(--line);margin-top:36px;padding-top:18px;color:var(--muted);font-size:.8rem}
.wa{position:fixed;left:20px;bottom:20px;z-index:1040;width:58px;height:58px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.7rem;box-shadow:0 8px 24px rgba(37,211,102,.45);animation:pl 2.4s infinite}
.wa:hover{color:#fff}@keyframes pl{50%{transform:scale(1.1)}}
.modal-content{background:var(--card);color:var(--text);border:1px solid color-mix(in oklab,var(--accent) 35%,transparent);border-radius:20px}
.modal-header,.modal-footer{border-color:var(--line)}
.fm label{font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:5px}
.trip{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trip label{border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:block;margin:0}
.trip input{display:none}.trip input:checked+label{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 8%,transparent)}
.trip b{display:block;color:var(--accent);font-size:1.4rem}
.ok{display:none;text-align:center;padding:30px 10px}.ok i{font-size:3rem;color:var(--accent)}
/* tweaks */
#tw{position:fixed;right:18px;bottom:18px;z-index:2000;width:290px;background:#141416;color:#eee;border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.5);font-family:var(--ff);display:none}
#tw.show{display:block}
#tw header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:700}
#tw header button{background:none;border:0;color:#aaa;font-size:1.2rem}
#tw section{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
#tw h6{font-size:.68rem;letter-spacing:.16em;color:#999;text-transform:uppercase;margin:0 0 8px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:30px;height:30px;border-radius:8px;border:2px solid rgba(255,255,255,.15);padding:0}
.sw button.on{border-color:#fff;outline:2px solid #888;outline-offset:1px}
.pre{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pre button{display:flex;align-items:center;gap:7px;background:#1e1e21;border:1px solid rgba(255,255,255,.1);color:#ddd;border-radius:9px;padding:6px 8px;font-size:.75rem;text-align:left}
.pre button.on{border-color:#fff}
.pre i{width:22px;height:14px;border-radius:4px;flex-shrink:0}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const TWEAK_DEFAULTS=/*EDITMODE-BEGIN*/{
  "preset": "",
  "bg": "#f4efe6",
  "card": "#1a1a1a",
  "accent": "#FFD700",
  "lang": "tr"
}/*EDITMODE-END*/;
const PRESETS={
gece:{n:"Gece Altın",bg:"#0b0b0c",card:"#1a1a1a",accent:"#FFD700",light:0},
lacivert:{n:"Lacivert",bg:"#0a1224",card:"#131e38",accent:"#f2c94c",light:0},
bordo:{n:"Bordo",bg:"#14080c",card:"#251219",accent:"#e9c27a",light:0},
turkuaz:{n:"Akdeniz",bg:"#08161a",card:"#11252b",accent:"#3fd6c6",light:0},
zumrut:{n:"Zümrüt",bg:"#07130e",card:"#11231a",accent:"#d8b45a",light:0},
krem:{n:"Krem",bg:"#f4efe6",card:"#ffffff",accent:"#b8860b",light:1}};
const BGS=["#0b0b0c","#111827","#0a1224","#14080c","#08161a","#07130e","#1c1917","#f4efe6","#f7f7f5","#eef3f6"];
const CARDS=["#1a1a1a","#222226","#131e38","#251219","#11252b","#11231a","#ffffff","#faf6ee"];
const ACCS=["#FFD700","#e8c547","#f2c94c","#e9c27a","#d8b45a","#3fd6c6","#ff8a3d","#b8860b"];
let T={...TWEAK_DEFAULTS};
function lum(h){h=h.replace('#','');const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255);return .2126*r+.7152*g+.0722*b}
function mix(h,amt){h=h.replace('#','');let [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16));const t=amt>0?255:0,a=Math.abs(amt);[r,g,b]=[r,g,b].map(v=>Math.round(v+(t-v)*a));return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}
function applyTheme(){const s=document.documentElement.style,lb=lum(T.bg)>.5,lc=lum(T.card)>.5;
s.setProperty('--bg',T.bg);s.setProperty('--bg2',mix(T.bg,lb?-.04:.04));
